# CI — enforces the repo's own verification bar (.roo/rules/rules.md):
#   clean `npx tsc --noEmit` + full `npm test` for any src/ change, plus one
#   e2e pass (scripts/e2e/run.sh) since the e2e suites exercise real
#   spawn/worker flows against a local mock OpenRouter server.
#
# No API key and no network access are needed — the mock server serves the
# entire session. Only branches in the private maintenance repository run here.
name: ci

on:
  push:
    branches: ["wip/audit-20261027"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-campaign-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test-e2e:
    if: github.repository == 'Capsize-Games/headlesscode-internal' && github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, workstation-ci, headlesscode-internal-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The full test suite includes src/tools/__tests__/browser-action.test.ts,
      # which launches a REAL headless Chromium via Playwright — the browser
      # binary is a separate download, not part of npm ci.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Code standards (no new violations vs baseline)
        run: npm run check-standards

      - name: Architecture (no new findings vs baseline)
        run: npm run check-architecture

      - name: Full test suite
        run: npm test

      - name: End-to-end (mock OpenRouter, no key)
        run: bash scripts/e2e/run.sh
