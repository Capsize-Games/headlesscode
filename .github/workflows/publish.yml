# Build a release package on version tags and attach it to the private GitHub
# Release. Earlier public npm versions retain their published Apache-2.0 terms.
#
# The versioned package is attached to this private repository's GitHub
# Release. Earlier public npm versions remain available under their published
# Apache-2.0 terms; future proprietary source is not uploaded to npm.
#
# The tag's version in package.json must match the pushed v* tag.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  npm-publish:
    name: Verify and attach private release artifact
    runs-on: [self-hosted, Linux, X64, headlesscode-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Pack tarball and verify the bin launcher ships
        run: |
          TARBALL=$(npm pack --pack-destination . | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          tar -tzf "$TARBALL" | grep -q "package/bin/headlesscode.mjs" \
            || { echo "bin/headlesscode.mjs missing from tarball"; exit 1; }

      - name: Create private GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.tarball }}
