# Publish headlesscode to the npm registry on every version tag (v*).
#
# GitHub-hosted runners only — this is a public repo, so no self-hosted
# worker is needed. The full verification bar (typecheck + test suite) must
# pass before the package is allowed to reach the registry; the publish uses
# the NPM_ACCESS_TOKEN repository secret (an automation token with publish
# rights, configured in the repo Settings > Secrets and variables > Actions).
#
# Publishes under the tag's version: package.json and package-lock.json are
# bumped to the tagged version before the tag is cut (npm version), so a tag
# push to vX.Y.Z publishes headlesscode@X.Y.Z. Also creates a GitHub Release
# with the published tarball for visibility.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  npm-publish:
    name: Verify, publish to npm, attach release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Pack tarball and verify the bin launcher ships
        run: |
          TARBALL=$(npm pack --pack-destination . | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          tar -tzf "$TARBALL" | grep -q "package/bin/headlesscode.mjs" \
            || { echo "bin/headlesscode.mjs missing from tarball"; exit 1; }

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.tarball }}
