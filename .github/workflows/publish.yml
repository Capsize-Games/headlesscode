# Build a release package on version tags and attach it to the GitHub Release.
# This workflow does not publish packages to npm.
#
# The tag's version in package.json must match the pushed v* tag.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  npm-publish:
    name: Verify and attach release artifact
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Pack tarball and verify both bin launchers ship
        run: |
          TARBALL=$(npm pack --pack-destination . | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          tar -tzf "$TARBALL" > release-contents.txt
          for launcher in headlesscode headlesscode-control; do
            grep -Fx "package/bin/$launcher.mjs" release-contents.txt \
              || { echo "bin/$launcher.mjs missing from tarball"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.tarball }}
